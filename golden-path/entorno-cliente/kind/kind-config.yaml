# Clúster kind de un solo nodo con el puerto 80 del nodo (ingress-nginx
# usa hostPort 80) publicado en el puerto 8080 del Mac.
# Los entornos quedan en: http://env-<clientId>-<sha7>.localtest.me:8080
# (*.localtest.me resuelve a 127.0.0.1)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
